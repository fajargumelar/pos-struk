<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Struk</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eceef1; color: #111; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { padding: 16px 12px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 100vh; }
    .struk {
      position: relative; width: 80mm; max-width: 100%; background: #fff; padding: 5mm 4.5mm 6mm;
      font-size: 12.5px; line-height: 1.45; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); overflow: hidden;
    }
    .c { text-align: center; }
    .logo { max-width: 26mm; max-height: 26mm; display: block; margin: 0 auto 4px; }
    .nm { font-size: 16px; font-weight: 800; }
    .sub { color: #444; white-space: pre-line; font-size: 11.5px; }
    hr { border: 0; border-top: 1px dashed #999; margin: 8px 0; }
    .r { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
    .r span:last-child { text-align: right; }
    .it { margin-bottom: 5px; }
    .it .n { font-weight: 600; word-break: break-word; }
    .tot { font-size: 15px; font-weight: 800; }
    .foot { white-space: pre-line; color: #333; font-size: 11.5px; }
    .void { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .void span {
      transform: rotate(-28deg); border: 4px solid #c62828; color: #c62828; font-size: 46px; font-weight: 900;
      padding: 2px 18px; border-radius: 8px; opacity: .75; letter-spacing: 4px; background: rgba(255, 255, 255, .6);
    }
    .voidnote { color: #c62828; font-weight: 700; }
    .btn {
      min-height: 52px; padding: 0 22px; border-radius: 12px; border: 0; background: #0f766e; color: #fff;
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; width: 80mm; max-width: 100%;
    }
    .btn:disabled { opacity: .6; }
    .msg { background: #fff; padding: 24px 20px; border-radius: 12px; max-width: 360px; text-align: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
    .spin { width: 34px; height: 34px; border: 4px solid #cfd4da; border-top-color: #0f766e; border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="msg"><div class="spin"></div>Memuat struk…</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    // URL web app Apps Script (deployment produksi, /exec).
    const API = 'https://script.google.com/macros/s/AKfycbw1MrNIv3Zth-McF0-ulraIUZFFKTRJ0O1vfXisjinoHkfeMiyH0gzLgahAor-55UAzIA/exec';

    const wrap = document.getElementById('wrap');
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n = v => Number(v || 0).toLocaleString('id-ID');
    const METODE = { tunai: 'Tunai', QRIS: 'QRIS', transfer: 'Transfer' };
    const logoOk = s => /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(String(s || ''));

    function pesan(html) { wrap.innerHTML = `<div class="msg">${html}</div>`; }

    async function muat() {
      const q = new URLSearchParams(location.search);
      const nota = q.get('nota') || '', t = q.get('t') || '';
      if (!nota || !t) { pesan('<p>Tautan struk tidak lengkap.</p>'); return; }
      let res;
      try {
        // credentials: 'omit' → tanpa cookie akun Google, jadi tidak kena bug multi-akun.
        const r = await fetch(`${API}?api=struk&nota=${encodeURIComponent(nota)}&t=${encodeURIComponent(t)}`,
          { credentials: 'omit', cache: 'no-store', redirect: 'follow' });
        res = await r.json();
      } catch (e) {
        pesan('<p>Gagal memuat struk. Periksa koneksi internet lalu coba lagi.</p><button class="btn" onclick="location.reload()">Coba lagi</button>');
        return;
      }
      render(res);
    }

    function render(res) {
      const brand = (res && res.brand) || {};
      const d = res && res.data;
      const logo = logoOk(brand.logo) ? brand.logo : '';
      document.title = (brand.nama_brand ? brand.nama_brand + ' — ' : '') + 'Struk';

      if (!res || !res.ok || !d) {
        pesan(`${logo ? `<img class="logo" src="${esc(logo)}" alt="">` : ''}
          <p class="nm">${esc(brand.nama_brand || '')}</p>
          <p>Struk tidak ditemukan atau tautan sudah kedaluwarsa.</p>`);
        return;
      }

      const isVoid = d.status === 'void';
      wrap.innerHTML = `
        <div class="struk" id="struk">
          <div class="c">
            ${logo ? `<img class="logo" src="${esc(logo)}" alt="">` : ''}
            <div class="nm">${esc(brand.nama_brand)}</div>
            ${brand.alamat ? `<div class="sub">${esc(brand.alamat)}</div>` : ''}
            ${brand.kontak ? `<div class="sub">${esc(brand.kontak)}</div>` : ''}
          </div>
          <hr>
          <div class="r"><span>No. nota</span><span>${esc(d.no_nota)}</span></div>
          <div class="r"><span>Waktu</span><span>${esc(d.waktu)}</span></div>
          <div class="r"><span>Kasir</span><span>${esc(d.kasir)}</span></div>
          ${isVoid ? '<div class="c voidnote">TRANSAKSI DIBATALKAN (VOID)</div>' : ''}
          <hr>
          ${(d.items || []).map(i => `<div class="it"><div class="n">${esc(i.nama)}</div>
            <div class="r"><span>${n(i.qty)} × ${n(i.harga)}</span><span>${n(i.subtotal)}</span></div></div>`).join('')}
          <hr>
          <div class="r tot"><span>TOTAL</span><span>Rp ${n(d.total)}</span></div>
          <div class="r"><span>Metode</span><span>${esc(METODE[d.metode] || d.metode)}</span></div>
          <div class="r"><span>Bayar</span><span>${n(d.bayar)}</span></div>
          <div class="r"><span>Kembalian</span><span>${n(d.kembalian)}</span></div>
          ${brand.catatan_kaki ? `<hr><div class="c foot">${esc(brand.catatan_kaki)}</div>` : ''}
          ${isVoid ? '<div class="void"><span>VOID</span></div>' : ''}
        </div>
        <button class="btn" id="btnPdf">Download PDF</button>`;

      document.getElementById('btnPdf').onclick = async function () {
        const btn = this;
        const el = document.getElementById('struk');
        if (typeof html2pdf === 'undefined') { alert('Pustaka PDF gagal dimuat. Periksa koneksi internet.'); return; }
        btn.disabled = true; btn.textContent = 'Menyiapkan PDF…';
        const tinggiMm = Math.ceil(el.offsetHeight * 25.4 / 96) + 2;
        const lebarMm = Math.round(el.offsetWidth * 25.4 / 96);
        try {
          await html2pdf().set({
            margin: 0,
            filename: d.no_nota + '.pdf',
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2, backgroundColor: '#ffffff' },
            jsPDF: { unit: 'mm', format: [lebarMm, Math.max(lebarMm + 1, tinggiMm)], orientation: 'portrait' },
            pagebreak: { mode: 'avoid-all' }
          }).from(el).save();
        } catch (e) {
          alert('Gagal membuat PDF: ' + e.message);
        } finally {
          btn.disabled = false; btn.textContent = 'Download PDF';
        }
      };
    }

    muat();
  </script>
</body>
</html>
